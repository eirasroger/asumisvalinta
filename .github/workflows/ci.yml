name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      ASUMISVALINTA_DUCKDB_PATH: data/fixture.duckdb
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint Python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Load fixture warehouse
        run: uv run python scripts/load_fixture.py

      - name: Lint SQL
        run: uv run sqlfluff lint dbt/models dbt/tests

      - name: Build and test dbt models
        run: uv run dbt build --vars '{min_postal_codes_per_quarter: 1}'

      - name: Validate semantic layer
        run: uv run python scripts/validate_semantic_layer.py

      - name: Test Python and governed metrics
        run: uv run pytest
