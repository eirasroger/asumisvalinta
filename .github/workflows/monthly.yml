name: Monthly data refresh

on:
  # GitHub delays or drops scheduled runs at busy times, worst at the start of each hour.
  # Daily runs from the 3rd to the 10th retry until a scheduled run succeeds this month;
  # manual runs do not count.
  schedule:
    - cron: "23 5 3-10 * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Start from an empty warehouse (only for the very first run)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip once a scheduled run has succeeded this month
        id: check
        run: |
          succeeded=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow monthly.yml \
            --event schedule --status success --created ">=$(date -u +%Y-%m-01)" \
            --json databaseId --jq length)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$succeeded" -gt 0 ]; then
            echo "A scheduled run succeeded this month, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      ASUMISVALINTA_DUCKDB_PATH: data/asumisvalinta.duckdb
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Restore last month's warehouse
        if: ${{ !inputs.bootstrap }}
        run: |
          mkdir -p data
          gh release download --pattern asumisvalinta.duckdb --dir data

      - name: Ingest sources
        run: uv run asumisvalinta-ingest

      - name: Build and test models
        run: |
          uv run dbt deps
          uv run dbt build

      - name: Check source freshness
        continue-on-error: true
        run: uv run dbt source freshness

      - name: Validate semantic layer
        run: uv run python scripts/validate_semantic_layer.py

      - name: Check golden set references
        run: uv run asumisvalinta-eval --check

      - name: Build release files
        run: |
          uv run python scripts/build_release.py --output dist
          uv run dbt docs generate
          cp dbt/target/index.html dist/dbt-docs-index.html
          cp dbt/target/manifest.json dist/dbt-docs-manifest.json
          cp dbt/target/catalog.json dist/dbt-docs-catalog.json

      - name: Run the website's API calls on the new serving warehouse
        run: |
          ASUMISVALINTA_SERVING_URL="file://$PWD/dist/asumisvalinta-serving.duckdb"             uv run python scripts/vercel_build.py
          uv run python scripts/check_serving.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build postal code area map
        working-directory: web
        run: |
          npm ci
          npm run build:map -- ../dist/postal-areas.topo.json

      - name: Publish release
        run: |
          tag="data-$(date -u +%Y-%m-%d)"
          cp data/asumisvalinta.duckdb dist/asumisvalinta.duckdb
          gh release create "$tag" \
            dist/asumisvalinta.duckdb \
            dist/asumisvalinta-serving.duckdb \
            dist/raw-parquet.zip \
            dist/dbt-docs-index.html \
            dist/dbt-docs-manifest.json \
            dist/dbt-docs-catalog.json             dist/postal-areas.topo.json \
            --title "Data $(date -u +%Y-%m-%d)" \
            --notes "Warehouse built by the monthly refresh. Sources: Statistics Finland (CC BY 4.0, including Paavo postal code areas), ECB statistics." \
            --latest

      - name: Redeploy the website
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null

