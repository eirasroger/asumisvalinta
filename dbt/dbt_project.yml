name: asumisvalinta
version: "0.1.0"
profile: asumisvalinta
config-version: 2

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  asumisvalinta:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  asumisvalinta:
    +schema: seeds
    # Recreate seed tables on every run, so a changed CSV header loads into a restored warehouse.
    +full_refresh: true

snapshots:
  asumisvalinta:
    +schema: snapshots
