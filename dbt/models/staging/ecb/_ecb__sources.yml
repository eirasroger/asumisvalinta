sources:
  - name: ecb
    description: >
      ECB MFI interest rate statistics for Finland. Source: ECB statistics.
    schema: raw_ecb
    tables:
      - name: mir_interest_rates
        description: >
          Annualised agreed rates in Finland on new loans to households for house purchase, by rate
          fixation period, and on new household deposits with an agreed maturity.
        config:
          loaded_at_field: "cast(time_period || '-01' as timestamp)"
          freshness:
            warn_after: {count: 100, period: day}
            error_after: {count: 160, period: day}
