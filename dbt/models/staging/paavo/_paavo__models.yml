models:
  - name: stg_paavo__postal_areas
    description: Postal code areas with Finnish and Swedish names and municipality code.
    data_tests:
      - unique_combination:
          arguments:
            columns: [paavo_year, postal_code]
    columns:
      - name: postal_code
        data_tests:
          - not_null
      - name: municipality_code
        data_tests:
          - not_null
