models:
  - name: dim_postal_area
    description: >
      Every Finnish postal code area with its municipality, region, and the price and rent
      sub-areas Statistics Finland uses for its statistics. One row per postal code.
    columns:
      - name: postal_code
        description: Five-digit postal code.
        data_tests: [unique, not_null]
      - name: postal_area_name
        description: Name of the postal code area in Finnish.
      - name: postal_area_name_sv
        description: Name of the postal code area in Swedish.
      - name: municipality_code
        description: Three-digit municipality code.
        data_tests: [not_null]
      - name: municipality_name
        description: Municipality name.
        data_tests: [not_null]
      - name: region_code
        description: Two-digit region (maakunta) code.
        data_tests: [not_null]
      - name: region_name
        description: Region (maakunta) name.
      - name: price_sub_area_code
        description: Price statistics sub-area (for example 091-1, Helsinki 1). Empty outside the large cities.
      - name: price_sub_area_name
        description: Name of the price statistics sub-area.
      - name: rent_sub_area_code
        description: Rent statistics sub-area (for example 091_1, Helsinki 1). Empty outside the large cities.
      - name: rent_sub_area_name
        description: Name of the rent statistics sub-area.
      - name: is_helsinki_metro
        description: True for Helsinki, Espoo, Kauniainen and Vantaa (pääkaupunkiseutu).
        data_tests: [not_null]
      - name: area_m2
        description: Land area of the postal code area in square metres.

  - name: dim_area
    description: >
      Areas used by the area-level facts: price areas, rent areas, municipalities and housing
      company finance areas. An area is identified by its scheme and code.
    data_tests:
      - unique_combination:
          arguments:
            columns: [area_scheme, area_code]
    columns:
      - name: area_scheme
        description: Classification the code belongs to.
        data_tests:
          - accepted_values:
              arguments:
                values: [price_area, rent_area, rent_area_2015, municipality_2015, housing_finance_area]
      - name: area_code
        description: Area code within its scheme.
      - name: area_name
        description: Area name as published by Statistics Finland.
      - name: area_level
        description: Geographic level of the area.

  - name: dim_date
    description: Calendar months from 1988 to 2035 with quarter and year attributes.
    columns:
      - name: month_start_date
        description: First day of the month.
        data_tests: [unique, not_null]
      - name: quarter_start_date
        description: First day of the quarter.
      - name: year_start_date
        description: First day of the year.
      - name: quarter_label
        description: Quarter as text, for example 2025Q4.

  - name: dim_room_type
    description: Room types harmonised across the price and rent statistics.
    columns:
      - name: room_type
        description: one_room, two_room, three_room_plus or all.
        data_tests: [unique, not_null]
      - name: room_type_name
        description: Room type in English.
      - name: room_type_name_fi
        description: Room type in Finnish.

  - name: fct_dwelling_prices
    description: >
      Prices per square metre of old dwellings in housing companies, by geography, period,
      building type and room type. Prices are debt-free prices, which include the flat's share
      of the housing company loan. Suppressed cells have no price and is_suppressed = true.
      Figures marked preliminary are revised in later releases.
    data_tests:
      - unique_combination:
          arguments:
            columns: [area_scheme, area_code, period_grain, period_start_date, building_type, room_type]
    columns:
      - name: area_scheme
        description: postal_code, price_area or municipality_2015.
      - name: area_code
        description: Postal code or area code within the scheme.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_postal_area')
                field: postal_code
              config:
                where: "area_scheme = 'postal_code'"
                severity: warn
      - name: geography_level
        description: postal_code, sub_area, municipality, region, metro_aggregate or country.
      - name: period_grain
        description: quarter or year.
      - name: period_start_date
        description: First day of the period.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_start_date
      - name: period_label
        description: Period as published, for example 2025Q4 or 2025.
      - name: building_type
        description: block_of_flats, terraced_house or all.
        data_tests:
          - accepted_values:
              arguments:
                values: [block_of_flats, terraced_house, all]
      - name: room_type
        description: Harmonised room type.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_room_type')
                field: room_type
      - name: price_per_m2
        description: Average debt-free price per square metre in euros (arithmetic mean of transactions).
        data_tests:
          - value_between:
              arguments:
                min_value: 100
                max_value: 30000
      - name: transaction_count
        description: Number of transactions reported in the area and period, including transactions excluded from the average price.
      - name: price_index_2025
        description: Price index, 2025 = 100 (area rows only).
      - name: price_index_annual_change_pct
        description: Change in the price index from the same quarter a year earlier, in percent (area rows only).
      - name: is_suppressed
        description: True when Statistics Finland suppressed the price for confidentiality.
      - name: is_preliminary
        description: True when the period is preliminary and may be revised.

  - name: fct_price_index
    description: Chained price indices of old flats by price area and room type, quarterly from 1988, on several base years.
    data_tests:
      - unique_combination:
          arguments:
            columns: [area_code, period_start_date, building_type, room_type]
    columns:
      - name: price_index_1983
        description: Price index, 1983 = 100. The longest continuous nominal series.

  - name: fct_rents
    description: >
      Average rents per square metre per month, by geography, quarter, room type, funding type and
      rent series. The 2015-base series (including postal code rents) ends in 2025Q4; the 2025-base
      series starts in 2025Q1 and is published by rent area. Compare rent levels only within one series.
    data_tests:
      - unique_combination:
          arguments:
            columns: [area_scheme, area_code, period_start_date, room_type, funding_type, rent_series]
    columns:
      - name: area_scheme
        description: postal_code, rent_area or rent_area_2015.
      - name: area_code
        description: Postal code or rent area code.
      - name: rent_series
        description: 2015_base or 2025_base.
        data_tests:
          - accepted_values:
              arguments:
                values: [2015_base, 2025_base]
      - name: funding_type
        description: non_subsidised (free market), subsidised (state-subsidised, ARA) or all.
      - name: rent_per_m2
        description: Average rent per m² per month in euros, all tenancy agreements.
        data_tests:
          - value_between:
              arguments:
                min_value: 2
                max_value: 80
      - name: rent_per_m2_new_contracts
        description: Average rent per m² per month in euros for new tenancy agreements.
        data_tests:
          - value_between:
              arguments:
                min_value: 2
                max_value: 80
      - name: observation_count
        description: Number of rental agreements behind the average.
      - name: rent_index
        description: Rent index on the base year of the series.
      - name: period_start_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_start_date

  - name: fct_interest_rates
    description: >
      Average interest rates on new housing loans to households in Finland, by rate fixation period,
      monthly. Annualised agreed rates. Source: ECB statistics.
    columns:
      - name: month_start_date
        description: First day of the month.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_start_date
      - name: new_mortgage_rate_pct
        description: Average rate on all new housing loans, percent per year.
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: -1
                max_value: 20
      - name: new_mortgage_rate_variable_pct
        description: Average rate on new housing loans with a variable rate or fixation up to one year.
      - name: new_mortgage_rate_fixed_1_to_5y_pct
        description: Average rate on new housing loans fixed for over one and up to five years.
      - name: new_mortgage_rate_fixed_5_to_10y_pct
        description: Average rate on new housing loans fixed for over five and up to ten years.
      - name: new_mortgage_rate_fixed_over_10y_pct
        description: Average rate on new housing loans fixed for over ten years.

  - name: fct_building_cost_index
    description: >
      Building cost index (total index), monthly, on every published base year. Right-of-occupancy
      fee refunds are indexed with this index.
    data_tests:
      - unique_combination:
          arguments:
            columns: [month_start_date, base_year]
    columns:
      - name: index_value
        description: Index point figure on the base year.
        data_tests: [not_null]

  - name: fct_housing_company_charges
    description: >
      Income and cost items of housing companies in euros per m² per month, yearly, by housing
      finance area. Item k3001 (residential unit charges) is the average maintenance charge
      (hoitovastike) paid by shareholders.
    data_tests:
      - unique_combination:
          arguments:
            columns: [area_code, period_start_date, building_type, account_item_code]

  - name: mart_market_levels
    description: >
      Current market levels for flats in blocks of flats, one row per postal code and room type:
      price per m², rent per m², maintenance charge and historical growth rates. Each value states
      the geography level and period it comes from. When a postal code has no published figure,
      the value falls back to the price or rent sub-area, then the municipality, then the region,
      then the whole country.
    data_tests:
      - unique_combination:
          arguments:
            columns: [postal_code, room_type]
    columns:
      - name: postal_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_postal_area')
                field: postal_code
      - name: room_type
        data_tests: [not_null]
      - name: price_per_m2
        description: Latest average debt-free price per m² in euros at the finest level with published data.
        data_tests: [not_null]
      - name: price_geography_level
        description: Level the price comes from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [postal_code, price_sub_area, municipality, municipality_all_rooms, region, country]
      - name: price_geography_code
        description: Code of the area the price comes from.
      - name: price_period_grain
        description: quarter or year.
      - name: price_period_label
        description: Period of the price, for example 2026Q1.
      - name: price_transaction_count
        description: Number of transactions reported for that area and period.
      - name: price_is_preliminary
        description: True when the price is preliminary.
      - name: rent_per_m2
        description: >
          Latest average non-subsidised rent per m² per month in euros. New-contract rents are used
          where published, otherwise rents of all agreements.
        data_tests: [not_null]
      - name: rent_basis
        description: new_contracts or all_contracts.
        data_tests:
          - accepted_values:
              arguments:
                values: [new_contracts, all_contracts]
      - name: rent_geography_level
        description: Level the rent comes from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [rent_sub_area, municipality, region, country]
      - name: rent_geography_code
        description: Code of the area the rent comes from.
      - name: rent_period_label
        description: Quarter of the rent.
      - name: rent_observation_count
        description: Number of rental agreements behind the rent.
      - name: maintenance_charge_per_m2
        description: >
          Average maintenance charge (hoitovastike) per m² per month in euros for blocks of flats,
          for Greater Helsinki or for the rest of Finland.
        data_tests: [not_null]
      - name: price_cagr_5y
        description: Compound annual growth of the price index over the last 5 years.
      - name: price_cagr_10y
        description: Compound annual growth of the price index over the last 10 years.
      - name: price_min_annual_change_10y
        description: Lowest year-over-year change of the price index in the last 10 years.
      - name: price_max_annual_change_10y
        description: Highest year-over-year change of the price index in the last 10 years.
      - name: price_growth_area_code
        description: Price area whose index the growth rates come from.
      - name: rent_cagr_5y
        description: Compound annual growth of non-subsidised rents over the last 5 years, chained across the 2015-base and 2025-base series.
      - name: rent_cagr_10y
        description: Compound annual growth of non-subsidised rents over the last 10 years, chained across both series.
      - name: rent_growth_area_code
        description: Area whose rent index the growth rates come from.
