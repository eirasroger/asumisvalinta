seeds:
  - name: policy_parameters
    description: >
      Tax rules, lending limits and right-of-occupancy rules used by the scenario engine. Rules that
      changed over time have one row per validity period; an empty valid_from or valid_to means open.
    config:
      column_types:
        value: double
        valid_from: date
        valid_to: date
        retrieved_on: date
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [parameter_code, valid_from]
    columns:
      - name: parameter_code
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
      - name: source_url
        data_tests: [not_null]
      - name: retrieved_on
        data_tests: [not_null]

  - name: assumptions
    description: >
      Default values for the calculator that have no official source. Every row is an assumption
      that the user can change in the app.
    config:
      column_types:
        value: double
    columns:
      - name: parameter_code
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]

  - name: asp_major_cities
    description: >
      Municipalities where the higher maximum ASP loan applies. The ASP scheme gives first-time buyers
      an interest subsidy on part of their home loan.
    config:
      column_types:
        municipality_code: varchar
        retrieved_on: date
    columns:
      - name: municipality_code
        data_tests: [unique, not_null]
      - name: source_url
        data_tests: [not_null]

  - name: aso_charge_changes
    description: >
      Yearly change of the average right-of-occupancy charge (käyttövastike) in the whole country, from
      the yearly market reviews of right-of-occupancy dwellings by Varke (formerly ARA).
    config:
      column_types:
        year: integer
        annual_change_pct: double
        retrieved_on: date
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: annual_change_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -10
                max_value: 20
      - name: source_url
        data_tests: [not_null]
