seeds:
  - name: policy_parameters
    description: >
      Tax rules, lending limits and right-of-occupancy rules used by the scenario engine. Rules that
      changed over time have one row per validity period; an empty valid_from or valid_to means open.
    config:
      column_types:
        value: double
        valid_from: date
        valid_to: date
        retrieved_on: date
    data_tests:
      - unique_combination:
          arguments:
            columns: [parameter_code, valid_from]
    columns:
      - name: parameter_code
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]
      - name: source_url
        data_tests: [not_null]
      - name: retrieved_on
        data_tests: [not_null]

  - name: aso_offers
    description: >
      Sample of right-of-occupancy (asumisoikeus) buildings in blocks of flats offered by Asuntosäätiö
      in Helsinki, Espoo, Vantaa and Tampere. Charges and fees are building averages per weighted
      square metre (jm²) as published by the provider. The fee is the average price a new resident
      pays for the right of occupancy in that building.
    config:
      column_types:
        postal_code: varchar
        building_year: integer
        size_min_m2: double
        size_max_m2: double
        monthly_charge_eur_per_m2: double
        right_of_occupancy_fee_avg_eur_per_m2: double
        retrieved_on: date
    data_tests:
      - unique_combination:
          arguments:
            columns: [provider, site_name]
    columns:
      - name: postal_code
        description: Postal code of the building.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_postal_area')
                field: postal_code
      - name: monthly_charge_eur_per_m2
        description: Average monthly charge (käyttövastike) per weighted m² in euros.
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 5
                max_value: 40
      - name: right_of_occupancy_fee_avg_eur_per_m2
        description: Average right-of-occupancy fee (asumisoikeusmaksu) per weighted m² in euros.
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 50
                max_value: 2000
      - name: source_url
        data_tests: [not_null]

  - name: assumptions
    description: >
      Default values for the calculator that have no official source. Every row is an assumption
      that the user can change in the app.
    config:
      column_types:
        value: double
        is_assumption: boolean
        retrieved_on: date
    columns:
      - name: parameter_code
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]
      - name: is_assumption
        data_tests:
          - accepted_values:
              arguments:
                values: [true]

  - name: asp_major_cities
    description: >
      Municipalities where the higher maximum ASP loan applies. The ASP scheme gives first-time buyers
      an interest subsidy on part of their home loan.
    config:
      column_types:
        municipality_code: varchar
        retrieved_on: date
    columns:
      - name: municipality_code
        data_tests: [unique, not_null]
      - name: source_url
        data_tests: [not_null]
