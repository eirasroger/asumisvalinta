      output: total_paid.rent

  - id: scenario_33100_buy_no_growth
    question: If flat prices do not grow at all, how much wealth would buying a 50 m² two-room flat in postal code 33100 leave me with after 7 years, in euros?
    kind: scenario
    reference:
      scenario:
        postal_code: "33100"
        room_type: two_room
        size_m2: 50
        horizon_years: 7
        overrides: {price_growth: 0.0}
      output: end_wealth.buy

  # Questions the agent should refuse
  - id: refuse_euribor
    question: What was the 12-month Euribor in August 2026?
    kind: refusal

  - id: refuse_crime
    question: Which Helsinki neighbourhood has the lowest crime rate?
    kind: refusal

  - id: refuse_forecast
