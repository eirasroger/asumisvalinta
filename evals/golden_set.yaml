  # Scenarios
  - id: scenario_00100_buy_wealth
    question: If I buy a 55 m² two-room flat in postal code 00100 and live there for 5 years, how much wealth would I have at the end with the default assumptions, in euros?
    kind: scenario
    reference:
      scenario: {postal_code: "00100", room_type: two_room, size_m2: 55, horizon_years: 5}
      output: end_wealth.buy

  - id: scenario_00100_rent_wealth
    question: With the default assumptions, how much wealth would I have after 5 years if I rent a 55 m² two-room flat in postal code 00100 instead of buying, in euros?
    kind: scenario
    reference:
      scenario: {postal_code: "00100", room_type: two_room, size_m2: 55, horizon_years: 5}
      output: end_wealth.rent

  - id: scenario_00100_break_even
    question: For a 55 m² two-room flat in postal code 00100, after how many years does buying catch up with renting under the default assumptions?
    kind: scenario
    tolerance: {absolute: 0}
    reference:
      scenario: {postal_code: "00100", room_type: two_room, size_m2: 55, horizon_years: 5}
      output: break_even_years_buy_vs_rent

  - id: scenario_33100_aso_wealth
    question: With default assumptions, what would my wealth be after 3 years in a 35 m² one-room right-of-occupancy flat in postal code 33100, in euros?
    kind: scenario
    reference:
      scenario: {postal_code: "33100", room_type: one_room, size_m2: 35, horizon_years: 3}
      output: end_wealth.aso

  - id: scenario_96100_break_even
    question: How many years does it take for buying a 75 m² flat with three or more rooms in postal code 96100 to beat renting, with the default assumptions?
    kind: scenario
    tolerance: {absolute: 0}
    reference:
      scenario: {postal_code: "96100", room_type: three_room_plus, size_m2: 75, horizon_years: 10}
      output: break_even_years_buy_vs_rent

  - id: scenario_02230_buy_five_percent
    question: If mortgage rates stay at 5 % a year, how much wealth would I have after 5 years from buying a 50 m² two-room flat in postal code 02230, in euros?
    kind: scenario
    reference:
      scenario:
        postal_code: "02230"
        room_type: two_room
        size_m2: 50
        horizon_years: 5
        overrides: {interest_rate: 0.05}
      output: end_wealth.buy

  - id: scenario_00100_rent_total_paid
    question: How much would I pay in total over 5 years to rent a 30 m² one-room flat in postal code 00100 with the default assumptions, in euros?
    kind: scenario
    reference:
