# Golden questions for the agent evaluation.
#
# kind: metric        expected value = the single value returned by `reference.metrics`
#                     with `reference.group_by` and `reference.where` through the semantic layer
# kind: scenario      expected value = `reference.output` of the scenario engine run with
#                     `reference.scenario` on the warehouse defaults
# kind: refusal       the agent should refuse
# kind: clarification the agent should ask for clarification
#
# tolerance: relative (share of the expected value) or absolute (in the unit of the question).

defaults:
  tolerance: {relative: 0.005}

questions:
  # Prices per square metre, quarterly statistics
  - id: price_00100_2025q4
    question: What was the average price per square metre of flats in blocks of flats in postal code 00100 in the fourth quarter of 2025, in euros?
    kind: metric
    reference:
      metrics: [avg_price_per_m2]
      group_by: [metric_time__quarter]
      where:
        - "{{ Entity('postal_area') }} = '00100'"
        - "{{ Dimension('dwelling_price__building_type') }} = 'block_of_flats'"
        - "{{ TimeDimension('metric_time', 'quarter') }} = '2025-10-01'"

  - id: price_00100_two_room_2025q4
    question: What was the average price per square metre of two-room flats in blocks of flats in postal code 00100 in 2025 Q4, in euros?
