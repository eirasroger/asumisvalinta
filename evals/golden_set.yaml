  - id: refuse_stockholm
    question: What is the average rent per square metre in Stockholm?
    kind: refusal

  - id: refuse_vacancies
    question: How many right-of-occupancy flats are vacant in Vantaa right now?
    kind: refusal

  # Questions that need clarification
  - id: clarify_price_location
    question: What is the average price per square metre?
    kind: clarification

  - id: clarify_scenario_details
    question: How much wealth would I have after 5 years if I buy?
    kind: clarification

  - id: clarify_compare
