[project]
name = "asumisvalinta"
version = "0.1.0"
description = "Rent, asumisoikeus or buy in Finland: a decision tool built on official open data."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6,<1.6",
    "pydantic>=2.13",
]

[dependency-groups]
ingest = [
    "dlt[duckdb]>=1.30,<2",
]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
default-groups = ["ingest", "dev"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project.scripts]
asumisvalinta-ingest = "asumisvalinta.ingestion.pipeline:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real public APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"
