[project]
name = "asumisvalinta"
version = "0.1.0"
description = "Rent, asumisoikeus or buy in Finland: a decision tool built on official open data."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "dbt-metricflow[dbt-duckdb]>=0.15,<0.16",
    "duckdb>=1.5.6,<1.6",
    "fastapi>=0.142,<1",
    "openai>=3.22,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13",
]

[dependency-groups]
ingest = [
    "dlt[duckdb]>=1.30,<2",
]
eval = [
    "pyyaml>=6,<7",
]
snowflake = [
    "dbt-snowflake>=1.12,<1.13",
]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.16",
    "sqlfluff>=4.3,<5",
    "sqlfluff-templater-dbt>=4.3,<5",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project.scripts]
asumisvalinta-ingest = "asumisvalinta.ingestion.pipeline:main"
asumisvalinta-eval = "asumisvalinta.evaluation.run:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The en dash writes ranges in Finnish text, for example "vuosina 1980–1989".
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real public APIs (deselect with -m 'not live')",
    "warehouse: needs the fixture warehouse built with dbt",
]
addopts = "-m 'not live'"
